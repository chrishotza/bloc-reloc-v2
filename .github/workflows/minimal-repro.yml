name: Minimal reproducibility safety

on:
  push:
    paths:
      - experiments/run_experiment.py
      - src/bloc_reloc_v2/**
      - tests/**
      - .github/workflows/minimal-repro.yml
  pull_request:
    paths:
      - experiments/run_experiment.py
      - src/bloc_reloc_v2/**
      - tests/**
      - .github/workflows/minimal-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graph test dependency
        run: python -m pip install 'networkx>=3,<4'
      - name: Compile the minimal experiment and regression tests
        run: python -m compileall -q experiments/run_experiment.py tests
      - name: Run small trusted synthetic fixtures and overwrite checks
        run: python -m unittest discover -s tests -v
